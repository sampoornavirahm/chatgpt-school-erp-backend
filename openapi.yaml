openapi: 3.1.0
info:
  title: School ERP Hosted API
  version: 0.3.0
  description: >-
    Optional outbound School Hub relay and hosted Parent app, plus Phase 8
    license activation and INR billing. The local School Hub remains
    authoritative for official school records.
servers:
  - url: https://api.example.com/api/v1
    description: Replace with the school's HTTPS backend URL.
tags:
  - name: Operations
  - name: Hub relay
  - name: Parent access
  - name: Account security
  - name: Webhooks
  - name: Licensing and billing
paths:
  /health:
    get:
      tags: [Operations]
      summary: Check the API and database connection
      responses:
        '200':
          description: API and database are available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                  service: { const: school-erp-backend }
                  database: { const: connected }
                required: [status, service, database]
        '503':
          description: Database is unavailable.
  /licensing/plans:
    get:
      tags: [Licensing and billing]
      summary: List enabled INR plans and current limits
      responses:
        '200':
          description: Enabled plans ordered by display position.
          content:
            application/json:
              schema:
                type: object
                required: [currency, plans]
                properties:
                  currency: { const: INR }
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/LicensePlan' }
  /setup/complete:
    post:
      tags: [Licensing and billing]
      summary: Create the installation's school and initial administrator
      description: Trial bypasses Google and activation checks. Outside trial, both a verified Google ID token and server activation code are required; the dummy provider is local/testing only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_name, admin_name, email, password]
              properties:
                school_name: { type: string, minLength: 2, maxLength: 160 }
                admin_name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
                google_id_token: { type: string, maxLength: 8192 }
                activation_code: { type: string, maxLength: 256 }
      responses:
        '201':
          {
            description: School configured with a signed Starter trial or permanent Starter license and initial admin token.,
          }
        '409': { description: Setup already completed. }
        '422': { description: Required setup fields, Google identity or activation check failed. }
  /setup/activate:
    post:
      tags: [Licensing and billing]
      summary: Verify Google identity and activate an existing trial school
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [google_id_token, activation_code]
              properties:
                google_id_token: { type: string, maxLength: 8192 }
                activation_code: { type: string, maxLength: 256 }
      responses:
        '200': { description: Original administrator verified and school license activated. }
        '409': { description: A school setup is required. }
        '422': { description: Google identity or license activation code failed. }
  /licensing/public-key:
    get:
      tags: [Licensing and billing]
      summary: Retrieve the Ed25519 license verification key
      responses:
        '200':
          description: Public verification key. The private signing key is never returned.
          content:
            application/json:
              schema:
                type: object
                required: [algorithm, key_id, public_key]
                properties:
                  algorithm: { const: Ed25519 }
                  key_id: { type: string }
                  public_key: { type: string, description: Base64url-encoded 32-byte public key. }
        '503': { description: License keys are not configured. }
  /licensing/verify:
    post:
      tags: [Licensing and billing]
      summary: Verify a signed license token and report its expiry state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 8192 }
      responses:
        '200': { description: Token signature is valid; state may be active, grace, or expired. }
        '422': { description: Malformed or invalid token. }
  /licensing/activate:
    post:
      tags: [Licensing and billing]
      summary: Redeem a one-time school activation code
      description: Outside trial, a Google ID token for the school's original administrator is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, server_id, activation_code]
              properties:
                school_id: { type: string, format: uuid }
                server_id: { type: string, format: uuid }
                activation_code: { type: string, maxLength: 128 }
                google_id_token: { type: string, maxLength: 8192 }
      responses:
        '200': { description: Signed license issued; retry on the same server is idempotent. }
        '409': { description: Activation code was already consumed by another server or revoked. }
        '422': { description: Activation code, server, or Google identity did not validate. }
  /licensing/status:
    get:
      tags: [Licensing and billing]
      summary: Read the authenticated school's trial and license status
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current trial dates, signed license and validity state. }
        '401': { description: Authentication required. }
  /licensing/current:
    post:
      tags: [Licensing and billing]
      summary: Fetch the latest signed license for a configured local Hub
      description: Validates the supplied school/server UUID pair. The returned token is bound to that server. Rate limited; never includes provider credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, server_id]
              properties:
                school_id: { type: string, format: uuid }
                server_id: { type: string, format: uuid }
      responses:
        '200': { description: Current signed license and hold state. }
        '404': { description: School/server pair is not registered. }
        '429': { description: License check rate limit exceeded. }
  /licensing/trial-extension-requests:
    post:
      tags: [Licensing and billing]
      summary: Request the school's one 15-day trial extension
      description: School administrator only. The operator must approve it; requesting never changes the license.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '202': { description: Request recorded for operator review. }
        '409': { description: Trial is not eligible or an extension was already used. }
  /licensing/trial-extension-requests/server:
    post:
      tags: [Licensing and billing]
      summary: Queue an extension request from a local Hub
      description: Rate-limited, non-authorizing request keyed to the registered school/server pair; operator approval is still required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, server_id]
              properties:
                school_id: { type: string, format: uuid }
                server_id: { type: string, format: uuid }
                note: { type: string, maxLength: 500 }
      responses:
        '202': { description: Request queued for operator review. }
        '409': { description: Trial is not eligible or extension was already used. }
        '429': { description: Request rate limit exceeded. }
  /school/payment-settings:
    get:
      tags: [Licensing and billing]
      summary: Read the school's own payment account configuration
      description: School administrator only. Credentials are represented by a configured flag and never returned.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          { description: Provider, public payment instructions and credential-configured status. }
    put:
      tags: [Licensing and billing]
      summary: Configure the school's own fee collection account
      description: School administrator only. Gateway credential values are encrypted at rest and omitted from all responses.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, is_enabled]
              properties:
                provider: { type: string, enum: [none, vpa, razorpay, payu] }
                merchant_vpa: { type: string, maxLength: 255 }
                merchant_name: { type: string, maxLength: 120 }
                provider_account_id: { type: string, maxLength: 160 }
                credentials:
                  {
                    type: object,
                    additionalProperties: { type: string, maxLength: 1024 },
                    maxProperties: 12,
                  }
                is_enabled: { type: boolean }
      responses:
        '200': { description: Safe settings response without credential values. }
        '422': { description: Provider configuration is incomplete or invalid. }
  /billing/orders:
    get:
      tags: [Licensing and billing]
      summary: List the signed-in user's recent orders and entitlements
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Up to 50 orders and the signed-in user's current entitlements. }
    post:
      tags: [Licensing and billing]
      summary: Create an INR order with a merchant UPI payment URI when configured
      description: Price and eligible payer are resolved on the server. This endpoint does not confirm payment.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_key, idempotency_key]
              properties:
                plan_key: { type: string, maxLength: 40 }
                idempotency_key: { type: string, format: uuid }
                student_seats:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 200000,
                    description: Optional future capacity included in a school-paid Professional order.,
                  }
      responses:
        '201': { description: New pending UPI order. }
        '200': { description: Idempotent replay of an existing order. }
        '401': { description: Authentication required. }
        '422': { description: Plan, payer role, or school capacity is invalid. }
  /billing/orders/{order}/simulate-payment:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Licensing and billing]
      summary: Simulate a payment outcome in local and test environments
      description: Always disabled in production. A successful simulation grants an entitlement through the PHP backend.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome: { type: string, enum: [paid, failed], default: paid }
      responses:
        '200': { description: Payment simulation result or idempotent replay. }
        '401': { description: Authentication required. }
        '404': { description: Order is not owned by this school and user. }
        '503': { description: Payment simulation is disabled. }
  /relay/schools/{school}/sync/push:
    parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/RelayKey'
      - $ref: '#/components/parameters/RelayTimestamp'
      - $ref: '#/components/parameters/RelayNonce'
      - $ref: '#/components/parameters/RelaySignature'
    post:
      tags: [Hub relay]
      summary: Store a batch of student projections
      description: >-
        Maximum 50 snapshots per batch and 1 MB per student snapshot. Each
        snapshot accepts only student, attendance, timetable, homework,
        announcements, results and fees. A deleted student uses {deleted:true}.
        Attendance entries preserve their date, period (0 means full day),
        status key, school-defined display label and reason for parent views.
        Repeating the same batch ID and body returns the original response.
      parameters:
        - $ref: '#/components/parameters/RequestContentType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id, snapshots]
              properties:
                batch_id: { type: string, format: uuid }
                snapshots:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [student_public_id, revision, snapshot]
                    properties:
                      student_public_id: { type: string, format: uuid }
                      revision: { type: integer, minimum: 1 }
                      snapshot:
                        type: object
                        additionalProperties: true
                        description: Strict allowlisted projection object or a deletion tombstone.
      responses:
        '200':
          description: Idempotent batch result; individual snapshots may be rejected.
          headers:
            Idempotency-Replayed:
              schema: { type: string, enum: ['true', 'false'] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        studentPublicId: { type: string, format: uuid }
                        status: { type: string, enum: [accepted, stale, conflict, rejected] }
                        revision: { type: integer }
                        code: { type: string }
                  storedBytes: { type: integer }
                  cursor: { type: integer }
                required: [results, storedBytes, cursor]
        '401': { description: Missing, invalid, expired or tampered relay signature. }
        '409': { description: Nonce replay or batch identifier reused with a different payload. }
        '422': { description: Invalid batch or unsupported snapshot fields. }
        '429': { description: Relay request rate limit exceeded. }
  /relay/schools/{school}/calendar:
    parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/RelayKey'
      - $ref: '#/components/parameters/RelayTimestamp'
      - $ref: '#/components/parameters/RelayNonce'
      - $ref: '#/components/parameters/RelaySignature'
    post:
      tags: [Hub relay]
      summary: Store the revisioned school calendar projection
      description: >-
        The Hub sends at most 300 calendar events and 1 MB of JSON. The SHA-256
        content hash covers the UTF-8 JSON encoding of the events array. An
        identical revision and hash is idempotent; a lower revision is stale,
        and a changed payload at the same revision conflicts. A changed calendar
        triggers schedule-update notifications for active parents and teachers.
      parameters:
        - $ref: '#/components/parameters/RequestContentType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, content_hash, events]
              properties:
                revision: { type: integer, minimum: 1 }
                content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
                events:
                  type: array
                  maxItems: 300
                  items: { $ref: '#/components/schemas/SchoolCalendarEvent' }
      responses:
        '200':
          description: Calendar accepted, unchanged, or idempotently replayed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [accepted, unchanged] }
                  revision: { type: integer }
                required: [status, revision]
        '403': { description: School license is suspended or expired. }
        '404': { description: School was not found. }
        '409': { description: Calendar revision is stale or conflicts with an existing payload. }
        '422': { description: Calendar event validation, hash, or payload size failed. }
        '429': { description: Relay request rate limit exceeded. }
  /relay/schools/{school}/accounts/sync:
    parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/RelayKey'
      - $ref: '#/components/parameters/RelayTimestamp'
      - $ref: '#/components/parameters/RelayNonce'
      - $ref: '#/components/parameters/RelaySignature'
    post:
      tags: [Hub relay]
      summary: Synchronize mobile account contacts and parent-child access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accounts]
              properties:
                accounts:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [relay_user_id, name, email, phone, role, is_active]
                    properties:
                      relay_user_id: { type: integer, minimum: 1 }
                      name: { type: string, minLength: 2, maxLength: 120 }
                      email: { type: string, format: email, maxLength: 255 }
                      phone: { type: string, maxLength: 24 }
                      role: { type: string, enum: [parent, teacher] }
                      is_active: { type: boolean }
                      student_public_ids:
                        type: array
                        maxItems: 100
                        items: { type: string, format: uuid }
                      student_access:
                        type: array
                        maxItems: 100
                        items:
                          type: object
                          required: [student_public_id, access_level]
                          properties:
                            student_public_id: { type: string, format: uuid }
                            access_level: { type: string, enum: [full, schedule_only] }
      responses:
        '200': { description: Contacts and per-child authorization synchronized. }
        '401': { description: Invalid relay signature. }
        '422': { description: Account details or student links are invalid. }
        '429': { description: Relay request rate limit exceeded. }
  /relay/schools/{school}/sync/pull:
    parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/RelayKey'
      - $ref: '#/components/parameters/RelayTimestamp'
      - $ref: '#/components/parameters/RelayNonce'
      - $ref: '#/components/parameters/RelaySignature'
    get:
      tags: [Hub relay]
      summary: Pull queued parent commands
      parameters:
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Up to 100 queued parent commands after the cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands: { type: array, items: { $ref: '#/components/schemas/ParentCommand' } }
                  cursor: { type: integer }
                required: [commands, cursor]
        '401': { description: Invalid relay signature. }
        '409': { description: Nonce replay. }
        '429': { description: Relay request rate limit exceeded. }
  /relay/schools/{school}/sync/ack:
    parameters:
      - $ref: '#/components/parameters/SchoolId'
      - $ref: '#/components/parameters/RelayKey'
      - $ref: '#/components/parameters/RelayTimestamp'
      - $ref: '#/components/parameters/RelayNonce'
      - $ref: '#/components/parameters/RelaySignature'
    post:
      tags: [Hub relay]
      summary: Acknowledge locally processed parent commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [operation_id, status]
                    properties:
                      operation_id: { type: string, format: uuid }
                      status: { type: string, enum: [accepted, rejected] }
                      message: { type: string, maxLength: 240 }
      responses:
        '200':
          description: Number of command states updated for this school.
          content:
            application/json:
              schema:
                type: object
                properties: { updated: { type: integer } }
                required: [updated]
        '401': { description: Invalid relay signature. }
        '409': { description: Nonce replay. }
        '422': { description: Invalid acknowledgement batch. }
  /auth/sessions:
    get:
      tags: [Account security]
      summary: List active sessions for the verified account across its linked school accounts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          { description: At most 100 unexpired sessions, with device labels and last-use times. }
        '401': { description: Authentication required. }
        '403': { description: Parent or teacher role required. }
    delete:
      tags: [Account security]
      summary: Revoke every session belonging to the verified parent or teacher identity
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: All sessions were revoked; the caller must sign in again. }
        '401': { description: Authentication required. }
        '403': { description: Parent or teacher role required. }
  /auth/sessions/{session}:
    parameters:
      - name: session
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]+$' }
    delete:
      tags: [Account security]
      summary: Revoke one session belonging to the verified parent or teacher identity
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session revoked; signedOut indicates if it was the current session. }
        '401': { description: Authentication required. }
        '403': { description: Parent or teacher role required. }
        '404': { description: Session does not belong to the signed-in account. }
  /parent/children:
    get:
      tags: [Parent access]
      summary: Read synchronized children explicitly linked across the signed-in parent's verified school accounts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Only non-deleted children linked to active school accounts with the same verified Google identity, email, and phone. Schedule-only links contain child name/class and timetable only; private records and request actions are withheld server-side.
          content:
            application/json:
              schema:
                type: object
                properties:
                  children:
                    { type: array, items: { $ref: '#/components/schemas/ParentProjection' } }
                  calendarEvents:
                    type: array
                    items: { $ref: '#/components/schemas/SchoolCalendarEvent' }
                  calendarProjectedAt: { type: [string, 'null'], format: date-time }
                  calendarProjectedAtBySchool:
                    type: object
                    additionalProperties: { type: string, format: date-time }
                  syncedAt: { type: string, format: date-time }
                required:
                  [
                    children,
                    calendarEvents,
                    calendarProjectedAt,
                    calendarProjectedAtBySchool,
                    syncedAt,
                  ]
        '401': { description: Authentication required. }
        '403': { description: Parent role required. }
  /parent/children/{student}:
    parameters:
      - name: student
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Parent access]
      summary: Read one explicitly linked child's synchronized school snapshot
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Child snapshot and that school's projected calendar from an active account linked to this verified parent identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentPublicId: { type: string, format: uuid }
                  schoolId: { type: string, format: uuid }
                  schoolName: { type: string }
                  linkStatus: { type: string, enum: [linked] }
                  accessLevel: { type: string, enum: [full, schedule_only] }
                  revision: { type: integer }
                  snapshot: { $ref: '#/components/schemas/ParentStudentSnapshot' }
                  calendarEvents:
                    type: array
                    items: { $ref: '#/components/schemas/SchoolCalendarEvent' }
                  calendarProjectedAt: { type: [string, 'null'], format: date-time }
                  calendarProjectedAtBySchool:
                    type: object
                    additionalProperties: { type: string, format: date-time }
                  projectedAt: { type: string, format: date-time }
                required:
                  [
                    studentPublicId,
                    schoolId,
                    schoolName,
                    linkStatus,
                    accessLevel,
                    revision,
                    snapshot,
                    calendarEvents,
                    calendarProjectedAt,
                    calendarProjectedAtBySchool,
                    projectedAt,
                  ]
        '401': { description: Authentication required. }
        '403': { description: Parent role required. }
        '404': { description: Child is not linked to this verified identity. }
  /parent/commands:
    get:
      tags: [Parent access]
      summary: Read this parent's queued request statuses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          { description: At most 100 requests belonging to this parent's verified school accounts. }
        '401': { description: Authentication required. }
        '403': { description: Parent role required. }
    post:
      tags: [Parent access]
      summary: Queue an idempotent parent request for the local Hub
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_id, student_public_id, operation, payload]
              properties:
                operation_id: { type: string, format: uuid }
                student_public_id: { type: string, format: uuid }
                operation: { const: parent_request.submit }
                payload:
                  type: object
                  required: [request_type, message]
                  properties:
                    request_type:
                      type: string
                      enum:
                        [
                          leave,
                          profile_change,
                          document,
                          other,
                          data_access,
                          data_correction,
                          data_deletion,
                          attendance_correction,
                        ]
                      description: Data access/correction/deletion are sent for school review; submitting a request never changes or deletes school records automatically.
                    starts_on:
                      type: [string, 'null']
                      format: date
                      description: Required and not in the future for attendance_correction; optional for other request types.
                    ends_on: { type: [string, 'null'], format: date }
                    message: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '202': { description: Request queued for the school's next relay poll. }
        '200': { description: Identical operation ID already recorded for this parent. }
        '401': { description: Authentication required. }
        '403': { description: Parent role required. }
        '404': { description: Student is not linked to this parent in this school. }
        '409': { description: Operation ID conflicts with a different parent. }
  /parent/support-tickets/public-login:
    post:
      tags: [Parent access]
      summary: Submit a rate-limited parent sign-in help request before authentication
      description: Unverified contact details are visible only to platform operators. The sender can see the response in the authenticated parent app only after signing in with the same registered Google email and phone. The operator must verify identity and manually route the request; this endpoint sends no email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_id, name, email, phone, subject, message]
              properties:
                operation_id: { type: string, format: uuid }
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 255 }
                phone: { type: string, minLength: 8, maxLength: 24 }
                school: { type: [string, 'null'], maxLength: 160 }
                subject: { type: string, minLength: 4, maxLength: 160 }
                message: { type: string, minLength: 10, maxLength: 3000 }
      responses:
        '201': { description: Login-support request accepted with reference and initial status. }
        '200': { description: Idempotent replay of the same request. }
        '409': { description: Operation ID was already used for different request details. }
        '422': { description: Contact or request details failed validation. }
        '429': { description: Public support request rate limit reached. }
  /parent/support-tickets:
    get:
      tags: [Parent access]
      summary: List support requests for the signed-in parent's verified school accounts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Up to 50 recent requests for the signed-in verified family accounts, including pre-login requests with the same recorded email and phone, status, school or platform routing, and the latest public response.
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          reference,
                          schoolId,
                          schoolName,
                          category,
                          subject,
                          message,
                          status,
                          escalationTarget,
                          createdAt,
                          updatedAt,
                        ]
                      properties:
                        reference: { type: string, example: SUP-0123456789ABCDEF }
                        schoolId: { type: [string, 'null'], format: uuid }
                        schoolName: { type: [string, 'null'] }
                        studentPublicId: { type: [string, 'null'], format: uuid }
                        category: { type: string }
                        subject: { type: string }
                        message: { type: string }
                        status:
                          {
                            type: string,
                            enum:
                              [open, in_progress, waiting_on_parent, escalated, resolved, closed],
                          }
                        escalationTarget: { type: string, enum: [school, platform] }
                        response: { type: [string, 'null'] }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        '401': { description: Authentication required. }
        '403': { description: Parent role required. }
    post:
      tags: [Parent access]
      summary: Create an idempotent parent support request
      description: Requests are visible in the operator support inbox. School routing is a manual handoff; this endpoint does not send email or guarantee an external response.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_id, category, subject, message]
              properties:
                operation_id: { type: string, format: uuid }
                student_public_id: { type: [string, 'null'], format: uuid }
                category:
                  type: string
                  enum:
                    [
                      login_access,
                      child_linking,
                      record_visibility,
                      school_fees,
                      platform_payments,
                      backup_restore,
                      ads,
                      purchases,
                      technical_issue,
                      other,
                    ]
                subject: { type: string, minLength: 4, maxLength: 160 }
                message: { type: string, minLength: 10, maxLength: 3000 }
      responses:
        '201': { description: Support request created with reference and initial status. }
        '200': { description: Identical operation ID already recorded. }
        '401': { description: Authentication required. }
        '403': { description: Parent role or school account required. }
        '404': { description: Child is not linked to this verified parent identity. }
        '409': { description: Operation ID conflicts or child link is ambiguous. }
  /webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9_-]{2,40}$' }
      - name: X-Webhook-Timestamp
        in: header
        required: true
        schema: { type: string }
      - name: X-Webhook-Event-ID
        in: header
        required: true
        schema: { type: string, maxLength: 180 }
      - name: X-Webhook-Signature
        in: header
        required: true
        schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    post:
      tags: [Webhooks]
      summary: Record a signed provider webhook for later processing
      description: >-
        The current endpoint verifies a shared HMAC secret and timestamp, then
        deduplicates by provider and event ID. It records the payload hash only;
        it does not process payments or change entitlements.
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses:
        '202': { description: New webhook receipt stored as received_unprocessed. }
        '200': { description: Matching event ID and payload already recorded. }
        '401': { description: Invalid provider signature or timestamp. }
        '409': { description: Event ID reused with a different payload. }
        '503': { description: Webhook secret is not configured or receipt storage failed. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    SchoolId:
      name: school
      in: path
      required: true
      schema: { type: string, format: uuid }
    RelayKey:
      name: X-Relay-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    RelayTimestamp:
      name: X-Relay-Timestamp
      in: header
      required: true
      description: Unix timestamp in seconds; accepted within five minutes of server time.
      schema: { type: string, pattern: '^[0-9]+$' }
    RelayNonce:
      name: X-Relay-Nonce
      in: header
      required: true
      description: Unique random base64url nonce per signed request.
      schema: { type: string, minLength: 20, maxLength: 64 }
    RelaySignature:
      name: X-Relay-Signature
      in: header
      required: true
      description: Lowercase hex HMAC-SHA256 over method, exact path/query, timestamp, nonce and lowercase SHA-256 body hash, separated by newlines.
      schema: { type: string, pattern: '^[a-f0-9]{64}$' }
    RequestContentType:
      name: Content-Type
      in: header
      required: true
      schema: { const: application/json }
  schemas:
    LicensePlan:
      type: object
      required:
        [
          key,
          name,
          description,
          currency,
          billing_period,
          billing_mode,
          feature_flags,
          ad_supported,
        ]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        currency: { const: INR }
        billing_period: { type: string, enum: [free, annual, custom] }
        billing_mode: { type: string, enum: [free, ad_supported, upfront, installments] }
        school_price_paise: { type: [integer, 'null'], minimum: 0 }
        student_price_paise: { type: [integer, 'null'], minimum: 0 }
        parent_price_paise: { type: [integer, 'null'], minimum: 0 }
        teacher_price_paise: { type: [integer, 'null'], minimum: 0 }
        student_limit:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: Basic Adware defaults to Starter's 100-student cap; operators may configure it.,
          }
        teacher_limit:
          {
            type: [integer, 'null'],
            minimum: 1,
            description: Basic Adware defaults to Starter's 1-teacher cap; operators may configure it.,
          }
        feature_flags: { type: array, items: { type: string } }
        ad_supported: { type: boolean }
    ParentCommand:
      type: object
      properties:
        cursor: { type: integer }
        operationId: { type: string, format: uuid }
        userId: { type: integer }
        studentPublicId: { type: string, format: uuid }
        operation: { const: parent_request.submit }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [cursor, operationId, userId, studentPublicId, operation, payload, createdAt]
    ParentProjection:
      type: object
      properties:
        studentPublicId: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        linkStatus: { type: string, enum: [linked] }
        accessLevel: { type: string, enum: [full, schedule_only] }
        revision: { type: integer }
        snapshot: { $ref: '#/components/schemas/ParentStudentSnapshot' }
        projectedAt: { type: string, format: date-time }
      required:
        [
          studentPublicId,
          schoolId,
          schoolName,
          linkStatus,
          accessLevel,
          revision,
          snapshot,
          projectedAt,
        ]
    ParentStudentSnapshot:
      type: object
      properties:
        student:
          type: object
          properties:
            fullName: { type: string }
            className: { type: string }
            sectionName: { type: string }
          additionalProperties: true
        timetable:
          type: array
          items: { $ref: '#/components/schemas/ParentTimetableEntry' }
      additionalProperties: true
    ParentTimetableEntry:
      type: object
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        period: { type: integer, minimum: 1 }
        startTime: { type: string }
        endTime: { type: string }
        room: { type: [string, 'null'] }
        subjectName: { type: string }
        teacherName:
          { type: [string, 'null'], description: Teacher assigned to the timetable entry. }
      required: [weekday, period, startTime, endTime, subjectName]
      additionalProperties: true
    SchoolCalendarEvent:
      type: object
      properties:
        id: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 160 }
        eventType:
          { type: string, enum: [holiday, closure, exam, trip, deadline, event, ptm, other] }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
        schoolId: { type: string, format: uuid, description: Added by the PHP parent API response. }
        schoolName: { type: string, description: Added by the PHP parent API response. }
      required: [id, title, eventType, startDate]
      additionalProperties: false
